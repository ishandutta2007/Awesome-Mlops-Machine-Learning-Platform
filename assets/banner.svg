<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient for Text/Shapes -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid { stroke: #334155; stroke-width: 0.5; opacity: 0.3; }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
      transform-origin: center;
    }
    .wave-line {
      stroke: url(#accentGrad);
      stroke-width: 3;
      fill: none;
      opacity: 0.6;
      animation: wave 8s ease-in-out infinite alternate;
    }
    .floating-card {
      fill: #1e293b;
      stroke: #475569;
      stroke-width: 1;
      opacity: 0.4;
      animation: float 6s ease-in-out infinite alternate;
    }
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #a855f7;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.3; }
      100% { transform: scale(1.05); opacity: 0.7; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes wave {
      0% { d: path("M 0 200 Q 300 150 600 220 T 1200 180"); }
      100% { d: path("M 0 180 Q 300 230 600 160 T 1200 210"); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" class="bg" rx="16" />

  <!-- Dynamic Background Grid -->
  <g class="grid">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" />
    <path d="M 100,0 L 100,300 M 200,0 L 200,300 M 300,0 L 300,300 M 400,0 L 400,300 M 500,0 L 500,300 M 600,0 L 600,300 M 700,0 L 700,300 M 800,0 L 800,300 M 900,0 L 900,300 M 1000,0 L 1000,300 M 1100,0 L 1100,300" />
  </g>

  <!-- Dynamic Graphic Elements in Background (Behind Text) -->
  <!-- Pulsing Glow Orbs -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1050" cy="220" r="140" fill="#ec4899" opacity="0.15" filter="url(#glow)" class="pulse-circle" />

  <!-- Floating Tech / Data Flow Cards (Low Opacity in Background) -->
  <rect x="80" y="160" width="160" height="90" rx="10" class="floating-card" />
  <rect x="960" y="50" width="170" height="100" rx="10" class="floating-card" style="animation-delay: -3s;" />

  <!-- Dynamic Animated Wave Line -->
  <path d="M 0 200 Q 300 150 600 220 T 1200 180" class="wave-line" />

  <!-- Main Content Overlay (Foreground - Guaranteed High Contrast & Clarity) -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <rect x="-140" y="-75" width="280" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#glow)"/>
    <text x="0" y="-54" class="badge-text" text-anchor="middle">⚡ MLOPS &amp; ML PLATFORMS ⚡</text>

    <!-- Main Title with Glow -->
    <text x="0" y="0" class="title-text" filter="url(#glow)">Awesome MLOps &amp; Machine Learning Platform</text>
    
    <!-- Subtitle -->
    <text x="0" y="42" class="subtitle-text">Curated Production-Grade SaaS Products &amp; Open-Source Projects</text>

    <!-- Subtitle Feature Pills -->
    <g transform="translate(0, 80)">
      <rect x="-260" y="-16" width="150" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
      <text x="-185" y="1" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">🧪 Experiment Tracking</text>

      <rect x="-95" y="-16" width="130" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
      <text x="-30" y="1" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">📦 Model Registry</text>

      <rect x="50" y="-16" width="105" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
      <text x="102" y="1" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">🚀 Model Serving</text>

      <rect x="170" y="-16" width="110" height="26" rx="13" fill="#0f172a" stroke="#334155"/>
      <text x="225" y="1" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">🔄 Pipeline DAGs</text>
    </g>
  </g>
</svg>
